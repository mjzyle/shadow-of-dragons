{%- comment -%}
  Overrides Minima's footer: keeps the site title and description, and drops
  the author/contact column, which only repeated the site title.
{%- endcomment -%}
<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading p-name">{{ site.title | escape }}</h2>
    <p class="footer-description">{{- site.description | escape -}}</p>

  </div>

</footer>
